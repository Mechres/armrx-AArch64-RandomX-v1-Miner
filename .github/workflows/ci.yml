# armrx CI
#
# Two jobs:
#   1. cross-build  — host-runnable on GitHub's ubuntu runners. Cross-compiles the
#      whole AArch64 JIT + test executables for aarch64-linux-gnu, proving that
#      src/jit_compiler_a64.cpp, jit_compiler_a64_static.S, and the rest of the
#      AArch64 path COMPILE on every PR. This closes the audit's core complaint
#      ("host-only green is insufficient — test_jit_equivalence etc. are gated on
#      ARMRX_HAVE_JIT and unbuildable on x86_64"). It does NOT execute the JIT
#      (no AArch64 CPU on the runner), so it cannot catch runtime/codegen regressions.
#   2. device-kat   — the REAL correctness gate (armrx_tests byte-identical hashes,
#      test_jit_equivalence 16/16, test_partial_dataset ALL PASSED). This REQUIRES
#      a self-hosted AArch64 runner labeled `aarch64-device` (the physical miner
#      device). If no such runner is registered, the job is skipped with a clear
#      note — it is NOT faked. Register the device runner to enable it; until then
#      the device gate remains a manual step (see devbox_* in AGENTS.md).
#
# NOTE: the project's device cross toolchain is aarch64-linux-musl-cross (AUR, musl
# libc matching the postmarketOS device). This workflow uses aarch64-linux-gnu
# (glibc, apt-installable on ubuntu runners) purely to prove the AArch64 sources
# compile; the musl toolchain is what actually produces device binaries.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cross-build:
    name: Cross-build AArch64 (compile-check JIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64
          # NOTE: we deliberately do NOT install OpenSSL dev headers. The shipping
          # device build uses the musl toolchain, which has no OpenSSL, so TLS pool
          # connections are compiled out there. To keep this CI job self-sufficient
          # AND representative of the real deploy, we disable the optional OpenSSL
          # find below (CMAKE_DISABLE_FIND_PACKAGE_OpenSSL) — the JIT path
          # (jit_compiler_a64.cpp / .S) compiles with or without TLS, so this still
          # closes the audit's "prove the AArch64 JIT compiles" gate.
          # If you later want CI to also compile-check the TLS path, instead add:
          #   sudo dpkg --add-architecture arm64
          #   sudo apt-get install -y libssl-dev:arm64
          # and drop the CMAKE_DISABLE_FIND_PACKAGE_OpenSSL flag.

      - name: Configure (AArch64 cross, glibc, TLS disabled to match musl deploy)
        run: |
          cmake -S . -B build-cross \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DARMRX_BUILD_TESTS=ON \
            -DARMRX_DISABLE_LTO=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE

      - name: Build library + tests (compile-check JIT for AArch64)
        run: cmake --build build-cross -j"$(nproc)"

  device-kat:
    name: On-device KAT gate (self-hosted AArch64)
    runs-on: [self-hosted, aarch64-device]
    # Skipped (not failed) when no self-hosted `aarch64-device` runner is registered.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cross-build (musl toolchain -> device binaries)
        run: |
          cmake -S . -B build-cross \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain-aarch64-musl.cmake \
            -DARMRX_BUILD_TESTS=ON
          cmake --build build-cross -j"$(nproc)"

      - name: Run device KATs (byte-identical + equivalence + partial-dataset)
        run: |
          cd build-cross
          ./armrx_tests
          ./test_jit_equivalence
          ./test_partial_dataset
